    <div id="loading">A gerar cartaz...</div>

    <script>
      var { createClient } = supabase;
      var db = createClient(SUPA_URL, SUPA_KEY);

      var params = new URLSearchParams(window.location.search);
      var barb_id = params.get("b") || "";
      var barb_nome = decodeURIComponent(params.get("n") || "O meu negócio");
      var preview_cartaz =
        params.get("preview") === "design" &&
        (location.hostname === "127.0.0.1" ||
          location.hostname === "localhost");
      var link_url = APP_URL + "/cliente.html?b=" + barb_id;

      var SCALE = 3;
      var W = 400;
      var H = 600;
      var canvas = document.getElementById("preview");
      canvas.width = W * SCALE;
      canvas.height = H * SCALE;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      var ctx = canvas.getContext("2d");
      ctx.scale(SCALE, SCALE);

      let logo_img = null;

      var qr_img = new Image();
      qr_img.crossOrigin = "anonymous";
      if (!preview_cartaz)
        qr_img.src =
          "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=" +
          encodeURIComponent(link_url) +
          "&bgcolor=ffffff&color=0a0a0a&margin=8";

      function qr_preview_local() {
        var q = document.createElement("canvas");
        q.width = q.height = 210;
        var qx = q.getContext("2d");
        qx.fillStyle = "#fff";
        qx.fillRect(0, 0, 210, 210);
        qx.fillStyle = "#101c30";
        for (var y = 0; y < 21; y++)
          for (var x = 0; x < 21; x++)
            if ((x * 7 + y * 11 + x * y) % 5 < 2)
              qx.fillRect(x * 10, y * 10, 10, 10);
        [
          [1, 1],
          [14, 1],
          [1, 14],
        ].forEach(function (p) {
          qx.fillStyle = "#fff";
          qx.fillRect(p[0] * 10 - 3, p[1] * 10 - 3, 76, 76);
          qx.fillStyle = "#101c30";
          qx.fillRect(p[0] * 10, p[1] * 10, 70, 70);
          qx.fillStyle = "#fff";
          qx.fillRect(p[0] * 10 + 10, p[1] * 10 + 10, 50, 50);
          qx.fillStyle = "#101c30";
          qx.fillRect(p[0] * 10 + 20, p[1] * 10 + 20, 30, 30);
        });
        return q;
      }

      async function init_cartaz() {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        if (preview_cartaz) {
          desenhar(qr_preview_local());
          document.getElementById("loading").style.display = "none";
          canvas.style.display = "block";
          document.getElementById("btns").style.display = "flex";
          return;
        }
        if (barb_id) {
          var { data: barb } = await db
            .from("barbearias")
            .select("logo_url")
            .eq("id", barb_id)
            .maybeSingle();
          if (barb && barb.logo_url) {
            logo_img = new Image();
            logo_img.crossOrigin = "anonymous";
            await new Promise(function (r) {
              logo_img.onload = r;
              logo_img.onerror = r;
              logo_img.src = barb.logo_url;
            });
          }
        }
        await new Promise(function (r) {
          if (qr_img.complete) r();
          else qr_img.onload = r;
        });
        desenhar(qr_img);
        document.getElementById("loading").style.display = "none";
        canvas.style.display = "block";
        document.getElementById("btns").style.display = "flex";
      }
      init_cartaz();

      function rr(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      function desenhar(qr) {
        ctx.fillStyle = "#f5f6f3";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#101c30";
        rr(ctx, 14, 14, W - 28, 160, 20);
        ctx.fill();

        ctx.fillStyle = "#dff45b";
        rr(ctx, 30, 30, 34, 34, 9);
        ctx.fill();
        ctx.fillStyle = "#101c30";
        ctx.font = "900 17px Inter";
        ctx.textAlign = "center";
        ctx.fillText("A", 47, 53);

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 16px Inter";
        ctx.textAlign = "left";
        ctx.fillText("Agendado.pt", 76, 52);
        ctx.fillStyle = "#91a0b6";
        ctx.font = "700 8px Inter";
        ctx.fillText("AGENDA ONLINE · 24 HORAS", 76, 66);

        ctx.fillStyle = "#dff45b";
        ctx.font = "800 9px Inter";
        ctx.fillText("MARCAÇÃO DIRETA", 30, 103);
        var nome_size =
          barb_nome.length > 18 ? 23 : barb_nome.length > 12 ? 28 : 33;
        ctx.fillStyle = "#ffffff";
        ctx.font = `850 ${nome_size}px Inter`;
        ctx.fillText(barb_nome, 30, 141);

        var qr_size = 200;
        var qr_x = W / 2 - qr_size / 2;
        var qr_y = 207;

        ctx.shadowColor = "rgba(20,32,51,0.15)";
        ctx.shadowBlur = 26;
        ctx.fillStyle = "#ffffff";
        rr(ctx, qr_x - 15, qr_y - 15, qr_size + 30, qr_size + 30, 18);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.drawImage(qr, qr_x, qr_y, qr_size, qr_size);

        ctx.fillStyle = "#142033";
        ctx.font = "800 13px Inter";
        ctx.textAlign = "center";
        ctx.fillText("APONTA A CÂMARA PARA MARCAR", W / 2, 448);
        ctx.fillStyle = "#697386";
        ctx.font = "500 10px Inter";
        ctx.fillText(
          "Escolhe o serviço, a pessoa e o horário em segundos.",
          W / 2,
          466,
        );

        ctx.fillStyle = "#dff45b";
        rr(ctx, 28, 493, W - 56, 72, 14);
        ctx.fill();
        ctx.fillStyle = "#101c30";
        ctx.font = "850 17px Inter";
        ctx.fillText("MARCA AGORA", W / 2, 523);
        ctx.font = "600 9px Inter";
        ctx.fillText("agendado.pt · reserva simples e segura", W / 2, 544);
      }

      async function guardar() {
        var blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
        var nome_ficheiro =
          "cartaz-" + barb_nome.toLowerCase().replace(/\s+/g, "-") + ".png";
        var file = new File([blob], nome_ficheiro, { type: "image/png" });
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share({
            files: [file],
            title: "Cartaz " + barb_nome,
          });
        } else {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = nome_ficheiro;
          a.click();
          URL.revokeObjectURL(url);
        }
      }

      async function partilhar() {
        if (navigator.share) {
          await navigator.share({
            title: "Agendado.pt — " + barb_nome,
            text: "Marca o teu próximo serviço online!",
            url: link_url,
          });
        } else {
          guardar();
        }
      }
      init_cartaz();
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
